<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>2026 퇴직금 계산기 | 근로기준법 퇴직소득세 실수령액 간이계산</title>
  <meta name="description" content="2026년 최신 소득세법 환산급여 공제 기준 반영. 입사일과 퇴사일, 최근 3개월 급여를 입력하면 세전 퇴직금과 퇴직소득세, 실수령액을 즉시 계산합니다." />
  <meta name="keywords" content="퇴직금계산기, 2026퇴직소득세, 퇴직금세금계산, 퇴직금실수령액, 평균임금계산" />

  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebApplication",
    "name": "2026 퇴직금 & 퇴직소득세 계산기",
    "applicationCategory": "FinanceApplication",
    "operatingSystem": "All",
    "offers": { "@type": "Offer", "price": "0", "priceCurrency": "KRW" }
  }
  </script>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen py-6 px-4">
  <div class="max-w-xl mx-auto bg-white rounded-2xl shadow-sm border border-slate-200 p-5 md:p-7">
    
    <!-- 헤더 -->
	<div class="flex items-center justify-between pb-4 mb-6 border-b border-slate-100">
		<div class="flex items-center gap-2">
			<a href="./index.html" class="inline-flex items-center justify-center w-8 h-8 rounded-lg bg-slate-100 hover:bg-slate-200 text-slate-600 transition-colors" title="홈으로">
				<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
					<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/>
				</svg>
			</a>
			<h1 class="text-lg md:text-xl font-extrabold text-slate-800">퇴직금 & 실수령액 계산기</h1>
		</div>
		<span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-semibold bg-emerald-50 text-emerald-700 border border-emerald-200">
		[2026년 기준 반영]
		</span>
	</div>

    <!-- 재직 기간 인풋 -->
    <div class="grid grid-cols-2 gap-3 mt-5">
      <div>
        <label class="block text-xs font-semibold text-slate-500 mb-1">입사일</label>
        <input type="date" id="startDate" value="2023-01-01" class="w-full p-2.5 font-bold text-slate-800 border border-slate-200 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none text-sm" />
      </div>
      <div>
        <label class="block text-xs font-semibold text-slate-500 mb-1">퇴사일</label>
        <input type="date" id="endDate" value="2026-01-01" class="w-full p-2.5 font-bold text-slate-800 border border-slate-200 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none text-sm" />
      </div>
    </div>
    <div class="mt-2 text-right">
      <span class="text-xs font-semibold text-slate-500">총 재직일수: </span>
      <span id="txtTotalDays" class="text-xs font-extrabold text-blue-600">1096일 (근속 3년)</span>
    </div>

    <!-- 임금 입력 폼 -->
    <div class="space-y-4 mt-5">
      <div>
        <label class="block text-xs font-semibold text-slate-500 mb-1">퇴직 전 3개월 기본급 합계</label>
        <div class="relative">
          <input type="number" id="pay3Months" value="9000000" step="100000" class="w-full p-2.5 text-right font-bold text-slate-800 border border-slate-200 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none" />
          <span class="absolute left-3 top-2.5 text-slate-400 text-sm">원</span>
        </div>
      </div>

      <div class="grid grid-cols-2 gap-3">
        <div>
          <label class="block text-xs font-semibold text-slate-500 mb-1">연간 상여금 총액</label>
          <div class="relative">
            <input type="number" id="annualBonus" value="0" step="100000" class="w-full p-2.5 text-right font-bold text-slate-800 border border-slate-200 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none" />
            <span class="absolute left-3 top-2.5 text-slate-400 text-xs">원</span>
          </div>
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-500 mb-1">연차수당 총액</label>
          <div class="relative">
            <input type="number" id="annualLeave" value="0" step="50000" class="w-full p-2.5 text-right font-bold text-slate-800 border border-slate-200 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none" />
            <span class="absolute left-3 top-2.5 text-slate-400 text-xs">원</span>
          </div>
        </div>
      </div>
    </div>

    <!-- 결과 패널 -->
    <div class="mt-6 p-4 bg-slate-50 rounded-xl border border-slate-200/60 space-y-2.5 text-sm">
      <div class="flex justify-between items-center">
        <span class="text-slate-500">1일 평균임금</span>
        <span id="resDailyWage" class="font-bold text-slate-700">0원</span>
      </div>
      <div class="flex justify-between items-center">
        <span class="text-slate-500">세전 퇴직금</span>
        <span id="resGross" class="font-bold text-slate-800">0원</span>
      </div>
      <div class="flex justify-between items-center">
        <span class="text-slate-500">예상 퇴직소득세 (지방소득세 포함)</span>
        <span id="resTax" class="font-bold text-rose-500">-0원</span>
      </div>
      <div class="pt-2 border-t border-slate-200 flex justify-between items-center">
        <span class="text-base font-bold text-slate-800">세후 실수령액</span>
        <span id="resNet" class="text-xl font-extrabold text-blue-600">0원</span>
      </div>
    </div>

    <!-- SEO 롱테일 가이드 -->
    <div class="mt-8 pt-6 border-t border-slate-100 text-xs text-slate-500 space-y-2 leading-relaxed">
      <p class="font-semibold text-slate-700">퇴직금 법정 요건 및 세금 상식</p>
      <p>• <strong>지급 기준</strong>: 주 15시간 이상, 1년(365일) 이상 계속 근로한 근로자에게 법적으로 지급 의무가 발생합니다.</p>
      <p>• <strong>퇴직소득세 완화</strong>: 정부 세법 개정에 따라 근속연수별 공제액이 대폭 상향되어, 10년 이하 근속 직장인의 퇴직소득세 실효세율은 매우 낮게 산출됩니다.</p>
    </div>

  </div>

  <script>
    // ②번 순수 연산 로직 인라인
    const SeveranceCalculator = {
      calculate(recent3MonthsPay, annualBonus, annualLeavePay, totalDays) {
        if (totalDays < 365) return { gross: 0, daily: 0, tax: 0, net: 0, eligible: false };
        const bonusPart = (annualBonus + annualLeavePay) * 0.25;
        const daily = (recent3MonthsPay + bonusPart) / 92;
        const gross = Math.floor(daily * 30 * (totalDays / 365));

        const years = Math.max(1, Math.ceil(totalDays / 365));
        
        // 근속연수공제
        let ded = 0;
        if (years <= 5) ded = years * 1000000;
        else if (years <= 10) ded = 5000000 + (years - 5) * 2000000;
        else if (years <= 20) ded = 15000000 + (years - 10) * 2500000;
        else ded = 40000000 + (years - 20) * 3000000;

        const convertedPay = Math.max(0, (gross - ded) * 12 / years);

        // 환산급여공제
        let convDed = 0;
        if (convertedPay <= 8000000) convDed = convertedPay;
        else if (convertedPay <= 70000000) convDed = 8000000 + (convertedPay - 8000000) * 0.6;
        else if (convertedPay <= 100000000) convDed = 45200000 + (convertedPay - 70000000) * 0.55;
        else if (convertedPay <= 300000000) convDed = 61700000 + (convertedPay - 100000000) * 0.45;
        else convDed = 151700000 + (convertedPay - 300000000) * 0.35;

        const taxBase = Math.max(0, convertedPay - convDed);
        
        // 간이세율
        let convTax = 0;
        if (taxBase <= 14000000) convTax = taxBase * 0.06;
        else if (taxBase <= 50000000) convTax = (taxBase * 0.15) - 1260000;
        else convTax = (taxBase * 0.24) - 5760000;

        const incomeTax = Math.floor(Math.max(0, convTax) * (years / 12));
        const totalTax = Math.floor(incomeTax * 1.1);

        return { gross, daily: Math.floor(daily), tax: totalTax, net: gross - totalTax, eligible: true };
      }
    };

    function update() {
      const sDate = new Date(document.getElementById('startDate').value);
      const eDate = new Date(document.getElementById('endDate').value);
      const diffTime = eDate - sDate;
      const totalDays = Math.max(0, Math.ceil(diffTime / (1000 * 60 * 60 * 24)));
      const years = Math.ceil(totalDays / 365);

      document.getElementById('txtTotalDays').textContent = `${totalDays}일 (근속 약 ${years}년)`;

      const p3 = Number(document.getElementById('pay3Months').value) || 0;
      const bonus = Number(document.getElementById('annualBonus').value) || 0;
      const leave = Number(document.getElementById('annualLeave').value) || 0;

      const res = SeveranceCalculator.calculate(p3, bonus, leave, totalDays);

      if (!res.eligible) {
        document.getElementById('resDailyWage').textContent = `${res.daily.toLocaleString()}원`;
        document.getElementById('resGross').textContent = '계속 근로 1년 미만 (지급 대상 아님)';
        document.getElementById('resTax').textContent = '-0원';
        document.getElementById('resNet').textContent = '0원';
        return;
      }

      document.getElementById('resDailyWage').textContent = `${res.daily.toLocaleString()}원`;
      document.getElementById('resGross').textContent = `${res.gross.toLocaleString()}원`;
      document.getElementById('resTax').textContent = `-${res.tax.toLocaleString()}원`;
      document.getElementById('resNet').textContent = `${res.net.toLocaleString()}원`;
    }

    ['startDate', 'endDate', 'pay3Months', 'annualBonus', 'annualLeave'].forEach(id => {
      document.getElementById(id).addEventListener('input', update);
    });

    update();
  </script>
</body>
</html>
