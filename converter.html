<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>단위 변환기 | 평수·제곱미터(㎡)·길이·무게 환산표</title>
  <meta name="description" content="아파트 면적(평 ↔ ㎡), 길이, 무게, 부피를 실시간으로 환산합니다. 부동산 중개보수 계산 전 필수 면적 변환 기능 제공." />
  <meta name="keywords" content="단위변환기, 평수계산기, 제곱미터평변환, 84제곱미터평수, 길이변환, 무게환산" />
  <meta property="og:title" content="스마트 단위 변환기 (평수·㎡·길이·무게)" />
  <meta property="og:description" content="수치 입력 즉시 모든 단위 환산 결과를 한눈에 확인하세요." />
  <meta property="og:type" content="website" />

  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebApplication",
    "name": "스마트 단위 변환기",
    "applicationCategory": "UtilitiesApplication",
    "operatingSystem": "All",
    "offers": { "@type": "Offer", "price": "0", "priceCurrency": "KRW" }
  }
  </script>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen py-6 px-4">
  <div class="max-w-xl mx-auto bg-white rounded-2xl shadow-sm border border-slate-200 p-5 md:p-7">
    
	<!-- 상단 공통 네비게이션 헤더 -->
    <div class="flex items-center justify-between pb-4 mb-6 border-b border-slate-100">
      <div class="flex items-center gap-2">
        <a href="./index.html" class="inline-flex items-center justify-center w-8 h-8 rounded-lg bg-slate-100 hover:bg-slate-200 text-slate-600 transition-colors" title="홈으로">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/>
          </svg>
        </a>
        <h1 class="text-lg md:text-xl font-extrabold text-slate-800">스마트 단위 변환기</h1>
      </div>
      <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-semibold bg-emerald-50 text-emerald-700 border border-emerald-200">
        [국제표준기호 반영]
      </span>
    </div>

    <!-- 1. 카테고리 탭 -->
    <div class="grid grid-cols-4 gap-1.5 mt-5" id="catTabs">
      <button data-cat="area" class="cat-btn py-2 text-xs md:text-sm font-semibold rounded-lg bg-blue-600 text-white">넓이(평)</button>
      <button data-cat="length" class="cat-btn py-2 text-xs md:text-sm font-semibold rounded-lg bg-slate-100 text-slate-600">길이</button>
      <button data-cat="weight" class="cat-btn py-2 text-xs md:text-sm font-semibold rounded-lg bg-slate-100 text-slate-600">무게</button>
      <button data-cat="volume" class="cat-btn py-2 text-xs md:text-sm font-semibold rounded-lg bg-slate-100 text-slate-600">부피</button>
    </div>

    <!-- 2. 입력 및 기준 단위 선택 -->
    <div class="mt-6 space-y-3">
      <label class="block text-xs font-semibold text-slate-500">값 및 기준 단위 입력</label>
      <div class="grid grid-cols-3 gap-2">
        <div class="col-span-2 relative">
          <input type="number" id="inputValue" value="84" class="w-full p-2.5 text-right font-bold text-slate-800 border border-slate-200 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none" />
        </div>
        <select id="fromUnitSelect" class="p-2.5 font-bold text-slate-800 border border-slate-200 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none bg-white text-sm">
        </select>
      </div>
    </div>

    <!-- 3. 실시간 전체 환산 결과 그리드 -->
    <div class="mt-6">
      <label class="block text-xs font-semibold text-slate-500 mb-2">전체 환산 결과</label>
      <div id="resultsGrid" class="space-y-2">
        <!-- 동적 렌더링 -->
      </div>
    </div>

    <!-- 4. 내부 연계 링크 (체류 시간 극대화) -->
    <div class="mt-8 p-4 bg-blue-50/60 rounded-xl border border-blue-100 flex items-center justify-between">
      <div>
        <p class="text-xs font-bold text-blue-900">부동산 매매·전월세 계산이 필요하신가요?</p>
        <p class="text-xs text-blue-700 mt-0.5">환산한 면적 기준으로 복비 상한요율을 즉시 확인해보세요.</p>
      </div>
      <a href="./real-estate.html" class="px-3 py-1.5 text-xs font-bold bg-blue-600 text-white rounded-lg hover:bg-blue-700 whitespace-nowrap">
        복비 계산 &rarr;
      </a>
    </div>

    <!-- 5. 롱테일 가이드 (SEO 텍스트 밀도 확보) -->
    <div class="mt-8 pt-6 border-t border-slate-100 text-xs text-slate-500 space-y-2 leading-relaxed">
      <p class="font-semibold text-slate-700">부동산 면적(평 ↔ ㎡) 상식</p>
      <p>• <strong>1평(坪)</strong>은 정확히 <strong>121분의 400 ㎡</strong>이며, 약 <strong>3.305785 ㎡</strong>입니다.</p>
      <p>• 아파트 국민평형으로 불리는 <strong>전용 84㎡</strong>는 약 <strong>25.4평</strong>(공급면적 기준 통상 32~34평형)에 해당합니다.</p>
      <p>• <strong>1㎡</strong>를 평수로 환산하려면 수치에 <strong>0.3025</strong>를 곱하면 간편합니다.</p>
    </div>

  </div>

  <script>
    // ②번 순수 연산 로직 인라인
    const UnitConverter = {
      convert(value, category, fromUnit, toUnit, unitsConfig) {
        if (isNaN(value) || value === null) return 0;
        const catData = unitsConfig[category];
        const fromRatio = catData.rates[fromUnit]?.ratio;
        const toRatio = catData.rates[toUnit]?.ratio;
        if (!fromRatio || !toRatio) return 0;
        const baseValue = value / fromRatio;
        const converted = baseValue * toRatio;
        return parseFloat(converted.toFixed(6));
      }
    };

    let unitsConfig = null;
    let currentCategory = 'area';

    async function init() {
      try {
        const res = await fetch('./config/rates.json');
        const data = await res.json();
        unitsConfig = data.units;
      } catch (err) {
        // Fallback 데이터 (로컬 환경 대응)
        unitsConfig = {
          area: {
            rates: {
              m2: { label: "제곱미터 (㎡)", ratio: 1.0 },
              pyeong: { label: "평 (坪)", ratio: 0.3025 },
              ft2: { label: "제곱피트 (ft²)", ratio: 10.76391 }
            }
          },
          length: {
            rates: {
              m: { label: "미터 (m)", ratio: 1.0 },
              cm: { label: "센티미터 (cm)", ratio: 100.0 },
              in: { label: "인치 (in)", ratio: 39.370079 }
            }
          },
          weight: {
            rates: {
              kg: { label: "킬로그램 (kg)", ratio: 1.0 },
              g: { label: "그램 (g)", ratio: 1000.0 },
              lb: { label: "파운드 (lb)", ratio: 2.204623 }
            }
          },
          volume: {
            rates: {
              l: { label: "리터 (L)", ratio: 1.0 },
              ml: { label: "밀리리터 (mL)", ratio: 1000.0 }
            }
          }
        };
      }
      renderSelectOptions();
      updateCalculations();
      bindEvents();
    }

    function renderSelectOptions() {
      const select = document.getElementById('fromUnitSelect');
      const rates = unitsConfig[currentCategory].rates;
      select.innerHTML = Object.entries(rates)
        .map(([k, v]) => `<option value="${k}">${v.label}</option>`)
        .join('');
    }

    function updateCalculations() {
      if (!unitsConfig) return;
      const val = parseFloat(document.getElementById('inputValue').value) || 0;
      const fromUnit = document.getElementById('fromUnitSelect').value;
      const rates = unitsConfig[currentCategory].rates;
      const grid = document.getElementById('resultsGrid');

      grid.innerHTML = Object.entries(rates).map(([k, v]) => {
        const resVal = UnitConverter.convert(val, currentCategory, fromUnit, k, unitsConfig);
        const isCurrent = k === fromUnit;
        return `
          <div class="flex justify-between items-center p-3 rounded-lg border ${isCurrent ? 'bg-blue-50/50 border-blue-200' : 'bg-slate-50 border-slate-200/60'} text-sm">
            <span class="font-medium text-slate-600">${v.label}</span>
            <span class="font-extrabold ${isCurrent ? 'text-blue-600' : 'text-slate-800'}">${resVal.toLocaleString()}</span>
          </div>
        `;
      }).join('');
    }

    function bindEvents() {
      document.querySelectorAll('#catTabs .cat-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
          document.querySelectorAll('#catTabs .cat-btn').forEach(b => b.className = 'cat-btn py-2 text-xs md:text-sm font-semibold rounded-lg bg-slate-100 text-slate-600');
          e.target.className = 'cat-btn py-2 text-xs md:text-sm font-semibold rounded-lg bg-blue-600 text-white';
          currentCategory = e.target.dataset.cat;
          
          // 기본값 세팅
          document.getElementById('inputValue').value = currentCategory === 'area' ? 84 : 100;
          renderSelectOptions();
          updateCalculations();
        });
      });

      document.getElementById('inputValue').addEventListener('input', updateCalculations);
      document.getElementById('fromUnitSelect').addEventListener('change', updateCalculations);
    }

    init();
  </script>
</body>
</html>
